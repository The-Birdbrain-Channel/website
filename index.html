<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Birdbrain Channel</title>

    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 36px;
        }

        .channels {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .channel {
            display: block;
            width: 45%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .channel:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.15);
        }

        .channel img {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 700px) {
            .channel {
                width: 100%;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>The Birdbrain Channel</h1>

        <div class="channels">

            <a class="channel" href="./streams/thebbchnl-ch01/">
                <img
                    src="./images/thebbchnl-ch01.png"
                    alt="Channel 1">
            </a>

            <a class="channel" href="./streams/thebbchnl-ch02/">
                <img
                    src="./images/thebbchnl-ch02.png"
                    alt="Channel 2">
            </a>

            <a class="channel" href="./streams/weatherluton/">
                <img
                    src="./images/weatherluton.png"
                    alt="WeatherLuton">
            </a>

        </div>

    </main>

</body>
</html>
