<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>WeatherLuton - Partner Channel</title>

    <link rel="icon" href="./favicon.ico" type="image/x-icon">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .toolbar {
            padding: 10px;
            background: #f5f5f5;
            border-bottom: 1px solid #ccc;
        }

        .back-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 5px;
            background: white;
        }

        .back-button:hover {
            background: #e5e5e5;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 62px);
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <button class="back-button" type="button" onclick="history.back();">
            ← Back
        </button>
    </div>

    <iframe src="https://mistlive.tv/channels/embed/weatherluton"title="WeatherLuton - Partner Channel"></iframe>

</body>
</html>
